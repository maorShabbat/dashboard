<style>

  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .btn { display: inline-block; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 16px; cursor: pointer; background: #0c1b3d; font-weight: 500; } .btn:hover { border-color: var(--accent-2); }
